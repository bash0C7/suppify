name: diag

on:
  push:
    branches: [ci-test-workflow]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-user

      - name: Probe qemu-arm with a trivial semihosting ELF
        shell: bash
        run: |
          cat > hello.c <<'EOF'
          #include <stdio.h>
          int main(void) { puts("hello"); return 0; }
          EOF
          arm-none-eabi-gcc -mcpu=cortex-a9 -marm --specs=rdimon.specs hello.c -o hello.elf
          readelf -lW hello.elf
          qemu-arm --version | head -1
          uname -r
          sysctl vm.mmap_min_addr
          for v in 65536 4096 0; do
            sudo sysctl -w vm.mmap_min_addr=$v
            echo "--- mmap_min_addr=$v"
            qemu-arm hello.elf; echo "exit=$?"
          done
          echo "--- strace"
          sudo apt-get install -y strace > /dev/null
          strace -f -e trace=mmap,mprotect,open,openat qemu-arm hello.elf 2>&1 | tail -n 25
